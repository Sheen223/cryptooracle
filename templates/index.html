<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CryptoOracle — Powered by OpenGradient</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #050708;
      --surface: #0c0f12;
      --border: #1c2530;
      --accent: #00ffcc;
      --accent-dim: rgba(0,255,204,0.08);
      --text: #dde8f0;
      --muted: #3a5060;
      --danger: #ff4466;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      overflow-x: hidden;
    }

    /* Animated grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,255,204,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,204,0.025) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      animation: gridShift 20s linear infinite;
    }

    @keyframes gridShift {
      0% { background-position: 0 0; }
      100% { background-position: 50px 50px; }
    }

    /* Glow orb */
    body::after {
      content: '';
      position: fixed;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(0,255,204,0.04) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 680px;
    }

    /* Header */
    .header {
      margin-bottom: 48px;
      animation: fadeDown 0.6s ease both;
    }

    .tag {
      font-size: 10px;
      letter-spacing: 3px;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 12px;
      opacity: 0.7;
    }

    .title {
      font-family: 'Syne', sans-serif;
      font-size: clamp(36px, 6vw, 56px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -1px;
      color: #fff;
    }

    .title span {
      color: var(--accent);
    }

    .subtitle {
      margin-top: 12px;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 1px;
    }

    /* Input area */
    .input-section {
      animation: fadeUp 0.6s ease 0.1s both;
    }

    .input-row {
      display: flex;
      gap: 12px;
      align-items: stretch;
    }

    .coin-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      font-size: 18px;
      font-weight: 700;
      padding: 18px 24px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .coin-input::placeholder {
      color: var(--muted);
      font-weight: 400;
      text-transform: none;
      letter-spacing: 1px;
    }

    .coin-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent), 0 0 30px rgba(0,255,204,0.08);
    }

    .analyze-btn {
      background: var(--accent);
      color: #000;
      border: none;
      font-family: 'Syne', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 18px 28px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      white-space: nowrap;
    }

    .analyze-btn:hover { opacity: 0.85; }
    .analyze-btn:active { transform: scale(0.97); }
    .analyze-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Quick coins */
    .quick-coins {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .quick-coin {
      font-size: 11px;
      letter-spacing: 1px;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 5px 12px;
      cursor: pointer;
      transition: all 0.15s;
      background: none;
      font-family: 'IBM Plex Mono', monospace;
    }

    .quick-coin:hover {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--accent-dim);
    }

    /* Loading */
    .loading {
      display: none;
      margin-top: 40px;
      align-items: center;
      gap: 16px;
      animation: fadeUp 0.3s ease both;
    }

    .loading.visible { display: flex; }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 2px;
    }

    .loading-text span {
      color: var(--accent);
      animation: blink 1s ease infinite;
    }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

    /* Result */
    .result {
      display: none;
      margin-top: 40px;
      border: 1px solid var(--border);
      background: var(--surface);
      animation: fadeUp 0.4s ease both;
    }

    .result.visible { display: block; }

    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
    }

    .result-coin {
      font-family: 'Syne', sans-serif;
      font-size: 20px;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 2px;
    }

    .result-badge {
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--muted);
      text-transform: uppercase;
    }

    .result-body {
      padding: 28px 24px;
      font-size: 14px;
      line-height: 1.8;
      color: var(--text);
      white-space: pre-wrap;
    }

    .result-footer {
      padding: 14px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .proof-label {
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--muted);
      text-transform: uppercase;
    }

    .proof-hash {
      font-size: 11px;
      color: var(--muted);
      word-break: break-all;
    }

    .proof-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    /* Error */
    .error {
      display: none;
      margin-top: 24px;
      padding: 16px 20px;
      border: 1px solid var(--danger);
      color: var(--danger);
      font-size: 12px;
      letter-spacing: 1px;
      animation: fadeUp 0.3s ease both;
    }

    .error.visible { display: block; }

    /* Powered by */
    .powered {
      margin-top: 48px;
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--muted);
      text-align: center;
      animation: fadeUp 0.6s ease 0.3s both;
    }

    .powered a {
      color: var(--accent);
      text-decoration: none;
      opacity: 0.7;
    }

    /* Animations */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <div class="tag">// OpenGradient · Verified AI</div>
      <h1 class="title">Crypto<span>Oracle</span></h1>
      <p class="subtitle">On-chain AI opinions on any coin — verified by TEE</p>
    </div>

    <div class="input-section">
      <div class="input-row">
        <input
          type="text"
          class="coin-input"
          id="coinInput"
          placeholder="Enter a coin name..."
          autocomplete="off"
        />
        <button class="analyze-btn" id="analyzeBtn" onclick="analyze()">
          Ask Oracle
        </button>
      </div>
      <div class="quick-coins">
        <span class="label" style="font-size:10px;color:var(--muted);align-self:center;letter-spacing:1px;">TRY:</span>
        <button class="quick-coin" onclick="quickCoin('Bitcoin')">BTC</button>
        <button class="quick-coin" onclick="quickCoin('Ethereum')">ETH</button>
        <button class="quick-coin" onclick="quickCoin('Solana')">SOL</button>
        <button class="quick-coin" onclick="quickCoin('XRP')">XRP</button>
        <button class="quick-coin" onclick="quickCoin('Dogecoin')">DOGE</button>
        <button class="quick-coin" onclick="quickCoin('Avalanche')">AVAX</button>
      </div>
    </div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <div class="loading-text">Querying verified AI<span>...</span></div>
    </div>

    <div class="error" id="error"></div>

    <div class="result" id="result">
      <div class="result-header">
        <div class="result-coin" id="resultCoin"></div>
        <div class="result-badge">AI Opinion · Verified</div>
      </div>
      <div class="result-body" id="resultBody"></div>
      <div class="result-footer">
        <div class="proof-dot"></div>
        <div class="proof-label">On-chain proof</div>
        <div class="proof-hash" id="proofHash"></div>
      </div>
    </div>

    <div class="powered">
     Powered by <a href="https://opengradient.ai" target="_blank">OpenGradient</a> · Verifiable AI Infrastructure · Built by <strong>Sheen</strong>
    </div>
  </div>

  <script>
    const input = document.getElementById('coinInput');

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') analyze();
    });

    function quickCoin(coin) {
      input.value = coin;
      analyze();
    }

    async function analyze() {
      const coin = input.value.trim();
      if (!coin) return;

      const btn = document.getElementById('analyzeBtn');
      const loading = document.getElementById('loading');
      const result = document.getElementById('result');
      const error = document.getElementById('error');

      // Reset
      result.classList.remove('visible');
      error.classList.remove('visible');
      loading.classList.add('visible');
      btn.disabled = true;

      try {
        const res = await fetch('/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ coin })
        });

        const data = await res.json();

        if (data.error) {
          error.textContent = '⚠ ' + data.error;
          error.classList.add('visible');
        } else {
          document.getElementById('resultCoin').textContent = data.coin;
          document.getElementById('resultBody').textContent = data.opinion;
          document.getElementById('proofHash').textContent = data.proof || 'Settled on-chain';
          result.classList.add('visible');
        }

      } catch (err) {
        error.textContent = '⚠ Network error — is the server running?';
        error.classList.add('visible');
      } finally {
        loading.classList.remove('visible');
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
